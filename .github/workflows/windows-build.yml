name: Windows installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  # Superseded branch/PR builds need not delay the newest one. Release tags finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci-requirements.txt
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - name: Install build dependencies
        run: |
          python -m pip install -r tools/ci-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }
          dotnet tool install --global wix --version 7.0.0
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          wix extension add -g WixToolset.UI.wixext/7.0.0 --acceptEula wix7
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension installation failed' }
      - name: Test, build and validate complete MSI
        id: package
        run: ./tools/build_release.ps1
      - name: Keep build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TpF2Multiplayer-${{ steps.package.outputs.version }}-${{ github.sha }}
          path: |
            installer/out/TpF2Multiplayer.msi
            installer/out/SHA256SUMS.txt
            installer/out/build-info.json
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.repository == 'tearded/tpf2-multiplayer' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TpF2Multiplayer-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: installer/out
      - name: Stage release, verify downloaded assets, then publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/publish_fork_release.ps1
